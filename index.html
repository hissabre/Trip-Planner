sh(`<b>📖 ${esc(t.dest)} guide</b><h2>🎒 Packing</h2>${L(g.packing)}<h2>🗣️ Phrases</h2>${L((g.phrases||[]).map(x=>x.en+' → '+x.local+' ('+x.say+')'))}<h2>🙏 Etiquette</h2>${L(g.etiquette)}<h2>💶 Money</h2>${p(g.money)}<h2>🚕 Getting around</h2>${p(g.transport)}<h2>🍽️ Food</h2>${p(g.food)}<h2>🆘 Essentials</h2>${p(g.emergency)}`)}
function gcal(d,i){const t=cur,x=t.days[d].items[i],dt=t.days[d].date.replace(/-/g,''),z=m=>dt+'T'+fm(m).replace(':','')+'00';
window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.k+' '+x.title)+'&dates='+z(x.s)+'/'+z(x.s+x.dur)+'&details='+encodeURIComponent(x.detail||'')+'&location='+encodeURIComponent(x.q)+(t.tz?'&ctz='+t.tz:''),'_blank')}
document.addEventListener('change',e=>{const c=e.target.closest&&e.target.closest('[data-ck]');if(c){const[d,i]=c.dataset.ck.split(',').map(Number);cur.days[d].items[i].done=c.checked;LS('dj_t',T);view()}
if(e.target.id=='rem'){P.rem=+e.target.value;LS('dj_p',P)}
if(e.target.id=='imp'){const f=e.target.files[0];if(f)f.text().then(x=>{try{const j=JSON.parse(x),ids=new Set(T.map(t=>t.id));(j.T||[]).forEach(t=>{if(!ids.has(t.id))T.push(t)});LS('dj_t',T);list();toast('✅ Restored')}catch(er){toast('Invalid backup file')}})}});
function sheet(d,i,add){shS={d,i};const t=cur,it=(t.days[d].items[i]||{});
$('#sh').hidden=false;$('#sh').innerHTML=`<button class="sb" data-a="close"></button><div class="sp">`+(add?`<b>＋ Add a stop to day ${d+1}</b><input id="shw" placeholder="A specific place or idea (or leave empty)"><div class="row"><button data-a="addgo">Add it</button><button data-a="addrand">🎲 Surprise me</button></div>`:
`<b>${it.k} ${esc(it.title)}</b>${it.more?'<p class="mu">'+esc(it.more)+'</p>':''}<button data-a="more">ℹ️ More details</button><div class="row"><button data-a="up">⬆️ Earlier</button><button data-a="dn">⬇️ Later</button></div>
<div class="row"><input type="time" id="sht" value="${fm(it.s)}"><input type="number" id="shd" value="${it.dur}" min="10" step="5"><button data-a="save">📌 Set time</button></div>
<div class="row"><select id="shm">${t.days.map((x,k)=>`<option value="${k}" ${k==d?'selected':''}>Day ${k+1}</option>`).join('')}</select><button data-a="mv">➡️ Move</button></div>
<button data-a="gcal">📅 Add to Google Calendar</button><input id="shw" placeholder="Swap for something specific (or leave empty)"><div class="row"><button data-a="swap">↻ Swap</button><button data-a="rm">🗑 Remove</button></div>`)+`<button data-a="close">Close</button></div>`}
async function addStop(di,wish){if(!hasAI())return addFree(di,wish);const t=cur,d=t.days[di],b4=conf(t,di).length;$('#sh').hidden=true;toast('Finding a spot… ⏳',60000);
try{const ctx=d.items.map(x=>fm(x.s)+' '+x.title+' ('+x.area+' '+x.lat+','+x.lon+')').join('\n');
const r=await ask(`Trip to ${t.dest}, one day's plan:\n${ctx}\n${wish?'The traveller wants to add: '+wish+'. Find the REAL, specific place that matches (use the exact place if named).':'Suggest ONE new REAL, specifically named stop that fits this day: near the others, different in kind, matching the traveller interests ('+((P.ints||[]).join(', ')||'any')+').'} Not already in the trip: ${t.days.flatMap(x=>x.items.map(y=>y.title)).join('; ')}. Dietary needs: ${(P.diet||[]).join(', ')||'none'}. Write in ${P.lang||'English'}. Return ONLY JSON {"title":"","emoji":"","area":"","addr":"","dur":90,"at":"HH:MM","type":"","detail":"1-2 concrete practical sentences","warn":"","lat":0.0000,"lon":0.0000}`,{cache:false});
const x=norm(r,t.dest);if(wish&&x.at&&/\d{1,2}\s?[:h]/.test(wish))x.fixed=true;
let bp=d.items.length,bc=1e9;for(let k=0;k<=d.items.length;k++){const a=d.items.slice();a.splice(k,0,x);const c=pc(t,a);if(c<bc){bc=c;bp=k}}
d.items.splice(bp,0,x);d.flow=true;done(di,b4)}catch(e){toast(err(e))}}
function optimize(di){const t=cur,d=t.days[di],it=d.items,mv=[];it.forEach((x,i)=>{if(!x.fixed&&!x.anch&&x.lat&&!/^(food|cafe)$/.test(x.type))mv.push(i)});if(mv.length<2)return 0;
const m=mv.slice(0,6),base=pc(t,it),perm=(a,k=[])=>a.length?a.flatMap((v,i)=>perm([...a.slice(0,i),...a.slice(i+1)],[...k,v])):[k];let best=it,bc=base;
perm(m.map(i=>it[i])).forEach(q=>{const a=it.slice();m.forEach((sl,j)=>a[sl]=q[j]);const c=pc(t,a);if(c<bc){bc=c;best=a}});
d.items=best;d.flow=true;sched(t);d.items.sort((x,y)=>x.s-y.s);sched(t);return base-bc}
function act(a,d,i){const t=cur,day=t.days[d],it=day.items,b4=conf(t,d).length,w=()=>($('#shw')||{}).value||'';
if(a=='more')return more(d,i);if(a=='tweak')return tweak();if(a=='guide')return guide();if(a=='gcal')return gcal(d,i);if(a=='open')return sheet(d,i);if(a=='close'){$('#sh').hidden=true;return}if(a=='add')return sheet(d,0,1);
if(a=='addgo'||a=='addrand')return addStop(d,a=='addgo'?w().trim():'');if(a=='swap')return repl(d,i,w().trim());
if(a=='opt'){toast('Checking real travel times… ⏳',20000);return legs(t,d).then(()=>{const g=optimize(d);LS('dj_t',T);view();toast(g>0?'🧭 Saved about '+Math.round(g)+' min of travel':'✅ Already an efficient route')})}
if(a=='rm')it.splice(i,1);
else if(a=='up'||a=='dn'){const j=a=='up'?i-1:i+1;if(j<0||j>=it.length)return;[it[i],it[j]]=[it[j],it[i]]}
else if(a=='save'){const m=/^(\d\d):(\d\d)$/.exec($('#sht').value);if(m){it[i].at=+m[1]*60+ +m[2];it[i].fixed=true}it[i].dur=+$('#shd').value||it[i].dur}
else if(a=='mv'){const k=+$('#shm').value;if(k==d)return;const x=it.splice(i,1)[0],o=t.days[k].items;let bp=o.length,bc=1e9;for(let n=0;n<=o.length;n++){const q=o.slice();q.splice(n,0,x);const c=pc(t,q);if(c<bc){bc=c;bp=n}}o.splice(bp,0,x);t.days[k].flow=true;day.flow=true;cd=k;sched(t);return done(k,conf(t,k).length)}
day.flow=true;done(d,b4)}
function list(){$('#trips').innerHTML=(T.length?T.map(t=>`<div class="card row"><button style="flex:1;text-align:left" data-o="${t.id}">✈️ ${esc(t.dest)}<br><small class="mu">${t.days[0].date} → ${t.days.at(-1).date}</small></button><button data-del="${t.id}">🗑</button></div>`).join('')+'<p class="mu">📴 Trips are saved on this device and work offline.</p>':'<p class="mu">No trips yet.</p>')+'<div class="bar"><button data-x="bk">⬇️ Backup</button><label><input type="file" id="imp" accept=".json" style="display:none"><span class="chip" style="display:inline-block;border:1px solid var(--ln);padding:9px 12px;border-radius:10px;cursor:pointer">⬆️ Restore</span></label></div>'}
function open_(id){if(id=='back'){show('plan');return}cur=T.find(t=>t.id==id);if(cur)view()}
const text=t=>'✈️ '+t.dest+'\n'+t.days.map((d,i)=>'\n'+(d.title||'Day '+(i+1)+' ('+d.date+')')+'\n'+d.items.map(x=>fm(x.s)+' '+x.k+' '+x.title+(x.ok?' ✅':'')+(x.detail?'\n   '+x.detail:'')+(x.warn?'\n   ⚠️ '+x.warn:'')).join('\n')).join('\n');
function dl(n,m,d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:m}));a.download=n;a.click()}
function exp(k){const t=cur;if(k=='bk')return dl('djibas-trips.json','application/json',JSON.stringify({T}));if(k=='pdf'){showAll=true;view();setTimeout(()=>{print();showAll=false;view()},300);return}
if(k=='wa')return window.open('https://wa.me/?text='+encodeURIComponent(text(t)),'_blank');
if(k=='copy'){navigator.clipboard&&navigator.clipboard.writeText(text(t));return}
if(k=='share'){navigator.share?navigator.share({title:t.dest,text:text(t)}).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(text(t));return}
const rem=P.rem==null?15:P.rem,tzp=t.tz?';TZID='+t.tz:'',z=(d,m)=>d.replace(/-/g,'')+'T'+fm(m).replace(':','')+'00',c=s=>String(s).replace(/[,;\n]/g,' ');
const ev=t.days.flatMap(d=>d.items.map((x,i)=>['BEGIN:VEVENT','UID:'+t.id+d.date+i+'@djibastrip','DTSTAMP:'+z(dstr(new Date()),0),'DTSTART'+tzp+':'+z(d.date,x.s),'DTEND'+tzp+':'+z(d.date,x.s+x.dur),'SUMMARY:'+c(x.k+' '+x.title),'LOCATION:'+c(x.q),'DESCRIPTION:'+c((x.detail||'')+(x.warn?' WARNING: '+x.warn:'')),...(rem?['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+c(x.title),'TRIGGER:-PT'+rem+'M','END:VALARM']:[]),'END:VEVENT'].join('\r\n')));
dl(t.dest+'-trip.ics','text/calendar','BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//DjibasTrip//EN\r\n'+ev.join('\r\n')+'\r\nEND:VCALENDAR')}
chips();
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}
})();
</script></body></html>
